[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "adaptive-odmr"
version = "0.1.0"
description = "Model-aware adaptive measurement control for open NV-center ODMR quantum sensors."
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
  "numpy>=1.26",
  "pandas>=2.0",
  "scipy>=1.11",
  "matplotlib>=3.8",
  "pyserial>=3.5",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.setuptools.packages.find]
include = ["adaptive_odmr*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
